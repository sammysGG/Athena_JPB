user www-data;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens on;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        root /var/www/html;
        index index.php index.html;

        ssl_certificate /etc/nginx/tls/jpa.local.crt;
        ssl_certificate_key /etc/nginx/tls/jpa.local.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header X-Powered-By "JPB Personnel Business Suite" always;
        add_header X-Internal-Host "jpb-ebs-app01.corp.local" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_pass 127.0.0.1:9000;
        }

        # Intentionally exposed for the blue team to discover.
        location /backups/ {
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }

        # Writable-looking upload area, also intentionally browsable.
        location /uploads/ {
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }

        location = /nginx_status {
            stub_status;
            allow all;
        }
    }
}
